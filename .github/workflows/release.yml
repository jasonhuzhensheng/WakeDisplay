# Auto-release: whenever main gets a new version number in build.sh, build the app on a
# macOS runner, zip it and publish a GitHub Release (tag vX.Y) with auto-generated notes.
# 自动发布：build.sh 里的版本号变了并推到 main，就自动编译、打包、创建 Release。
name: Release

on:
  push:
    branches: [main]
    paths: ['build.sh', 'main.swift', 'CGVirtualDisplay.h', 'Localization.swift', 'Telemetry.swift', 'Updater.swift', 'Advanced.swift', 'Extras.swift', 'Widget/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from build.sh
        id: v
        run: |
          VER=$(grep -m1 '^VERSION=' build.sh | sed -E 's/^VERSION="?([^"]+)"?.*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VER already released — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.v.outputs.exists == 'false'
        run: |
          chmod +x build.sh
          SKIP_INSTALL=1 ./build.sh
          ditto -c -k --keepParent WakeDisplay.app "WakeDisplay-v${{ steps.v.outputs.version }}.zip"

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          ## Install / 安装

          1. Download \`WakeDisplay-v${VER}.zip\` below and unzip / 下载下方 zip 并解压
          2. Move \`WakeDisplay.app\` to **Applications** / 拖到「应用程序」
          3. First launch (app is not notarized) / 首次启动（未经 Apple 公证）：
             \`xattr -dr com.apple.quarantine /Applications/WakeDisplay.app\` then open it / 然后打开

          Requires macOS 12+ on Apple Silicon / 需要 macOS 12+，Apple Silicon

          NOTES
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD~20..HEAD"; fi
            git log --no-merges --pretty='- %s' $RANGE | grep -v -E '^- (Cask:|CI:|README)' || true
            echo
          } > whatsnew.md
          cat whatsnew.md notes.md > body.md
          gh release create "v${VER}" "WakeDisplay-v${VER}.zip" \
            --title "WakeDisplay v${VER}" \
            --notes-file body.md \
            --target "$GITHUB_SHA"

      - name: Update Homebrew cask
        if: steps.v.outputs.exists == 'false'
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          SHA=$(shasum -a 256 "WakeDisplay-v${VER}.zip" | cut -d' ' -f1)
          sed -i '' -E "s/^  version \".*\"/  version \"${VER}\"/; s/^  sha256 .*/  sha256 \"${SHA}\"/" Casks/wakedisplay.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/wakedisplay.rb
          git commit -m "Cask: v${VER}" || exit 0
          git push origin HEAD:main
